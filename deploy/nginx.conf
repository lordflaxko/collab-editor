# Reverse proxy for the CodeMesh server.
#
# Put this in /etc/nginx/sites-available/codemesh and symlink it into
# sites-enabled. Run certbot afterwards -- it rewrites this file in place to
# add the TLS listener and the redirect from :80.
#
# Replace api.example.com with your own hostname.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Logs the path without the query string. The collaboration WebSocket
    # carries its session token as a query parameter, and the default format
    # records the whole request line -- which wrote a valid, month-long
    # session token into the access log on every connection, where anyone
    # who could read the file (or a log backup) could replay it. The
    # `codemesh` format is defined alongside the upgrade map; see below.
    access_log /var/log/nginx/access.log codemesh;

    # Certbot adds a redirect from :80, but a redirect still means the first
    # request leaves the browser in plaintext -- and for this app that request
    # can carry a session token in its query string. HSTS makes the browser
    # refuse to try HTTP at all after its first visit.
    #
    # `always` so it's sent on error responses too. No `preload`: that would
    # need submitting to the browser preload list and is painful to reverse,
    # and a duckdns.org subdomain can't be preloaded regardless.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Yjs sync, interactive runs, and the debugger all run over WebSocket.
    # Without the Upgrade/Connection pair nginx quietly downgrades them to
    # ordinary requests and the editor connects but never syncs.
    location / {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The server keys its rate limiting off this when TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A collaboration socket is idle whenever nobody is typing, and the
        # 60s default would drop it mid-session and force a reconnect.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Deploy previews stream a container's output; buffering makes them
        # arrive in lumps long after the run finished.
        proxy_buffering off;
    }

    # Project .zip exports and deploy previews can both be large.
    client_max_body_size 25m;
}

# $connection_upgrade is defined by a `map` that has to live in the http{}
# block, not in a server{} block like this one. deploy/setup.sh writes it to
# /etc/nginx/conf.d/codemesh-upgrade-map.conf, which Ubuntu already includes
# inside http{}. Setting this up by hand means creating that file with:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
#
# Without it nginx fails to start with "unknown $connection_upgrade".
