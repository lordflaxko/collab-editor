<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CodeMesh">
  <!-- The ◆ from the app's wordmark, in the same pink-to-teal gradient the
       rest of the UI uses. Deliberately one flat shape with no filters: a
       favicon is usually painted at 16px, where blur and fine detail turn to
       mud, and the previous icon carried a dozen blurred ellipses. -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F28D9E" />
      <stop offset="1" stop-color="#34CBB9" />
    </linearGradient>
  </defs>
  <!-- The dark tile keeps the mark legible against both light and dark
       browser chrome; the gradient alone would vanish on a pale tab strip. -->
  <rect width="32" height="32" rx="7" fill="#0E0C0B" />
  <path d="M16 6.5 25.5 16 16 25.5 6.5 16Z" fill="url(#m)" />
</svg>
