# Netlify hosts the client only. The server can't live here: it holds
# long-lived WebSocket connections for Yjs sync, keeps state on disk, and
# drives the host's Docker daemon — none of which a serverless platform
# does. Point VITE_SERVER_URL at wherever the server actually runs.

[build]
  # No `base` on purpose. Netlify's docs are ambiguous about whether
  # `publish` is resolved relative to `base` or to the repository root, and
  # getting it wrong produces a build that succeeds while publishing an
  # empty directory -- the site then 404s on every path and the deploy log
  # still reports success. Dropping `base` and writing both paths from the
  # repository root removes the ambiguity entirely.
  command = "cd client && npm ci && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# Set VITE_SERVER_URL in the Netlify UI (Site settings → Environment
# variables), not here — it differs per deploy and Vite inlines it at build
# time, so changing it needs a rebuild rather than a restart.

# The client routes on real paths (/login, /explore, /<projectId>), reading
# window.location.pathname rather than a hash. Without this rewrite the CDN
# looks for a file at that path and returns 404 on any direct link, refresh,
# or shared project URL — the index.html is only found at /.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
